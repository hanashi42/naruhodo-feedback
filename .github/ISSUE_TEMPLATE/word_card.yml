name: Word card report
description: A word card showed a wrong word, reading or meaning (opened from the card's Report button)
title: "Word card: "
labels: [bug]
body:
  - type: textarea
    id: report
    attributes:
      label: Report from Naruhodo
      description: Naruhodo copied this to your clipboard when you pressed Report — paste it here (Ctrl+V / ⌘V). It stays on your computer until you press Submit, and you can edit or delete anything first.
      render: text
    validations:
      required: true
  - type: textarea
    id: what-is-wrong
    attributes:
      label: What's wrong?
      description: What should the card have said? A guess is fine.
      placeholder: "It should be read かみ here, not がみ… / This word means … in this sentence"
    validations:
      required: false
  - type: input
    id: page-url
    attributes:
      label: Page (optional)
      description: The report leaves the page address out. Add it only if you're happy to share it — it helps us reproduce the card.
      placeholder: "https://…"
    validations:
      required: false
